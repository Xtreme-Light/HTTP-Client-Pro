# Tauri 桌面应用打包流水线：在 Linux 与 Windows 上构建并产出安装包。
# - push 到 main / 提交 PR 时仅构建并上传产物；
# - 推送 v* tag 或手动触发时，额外创建 GitHub Release。
name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: http-client-pro-linux-x86_64
          - platform: windows-latest
            artifact: http-client-pro-windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 Linux 构建所需的系统库（webkit2gtk / gtk / soup 等），
      # libclang-dev 供 rquickjs(bindgen) 生成 QuickJS 绑定使用。
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libclang-dev

      # Windows 上为 bindgen 指定 libclang 位置（runner 已预装 LLVM）。
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # 版本取自 package.json 的 packageManager 字段（pnpm@10.27.0）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 执行 pnpm --filter desktop tauri:build -> tauri build。
      # src-tauri 是仓库根 Cargo workspace 的成员，产物位于
      # 仓库根目录的 target/release/bundle/
      # （Linux: deb/rpm/appimage；Windows: msi/nsis）。
      - name: Build Tauri app
        run: pnpm tauri:build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: http-client-pro-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.exe
