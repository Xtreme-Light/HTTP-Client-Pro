[package]
name = "http-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP Request in Editor format core: lexer, parser, executor, response handler"

[lib]
name = "http_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
form_urlencoded = { workspace = true }
rquickjs = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
default = ["js-handler"]
# ES5.1 response handler script engine (spec 4.5). Pulls in QuickJS via
# rquickjs. Disable to ship a parser-only build (e.g. for MCP read-only mode).
js-handler = ["dep:rquickjs", "dep:sha2", "dep:sha1", "dep:md-5", "dep:hmac", "dep:hex", "dep:base64"]

[dev-dependencies]
insta = { workspace = true }
httpmock = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
